<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Amy's World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: the clay planet sits dead centre and fills the window. The headline floats above it, flight controls below it. */
:root {
  --sky: #D8ECFB; --ink: #24306B; --ink-dim: #4A5590; --plum: #6A4BD0; --leaf: #6FAE5A; --heart: #C9475A; --sun: #FFD166; --white: #FFFFFF; --glass: rgba(255, 255, 255, .72);
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); font-size: 16px; }
a { color: inherit; }
button { font: inherit; color: inherit; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; }

#stage { position: fixed; inset: 0; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#markers { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }

.marker { position: absolute; left: 0; top: 0; opacity: 0; display: flex; align-items: center; justify-content: center; border: 0; background: none; padding: 6px; cursor: pointer; pointer-events: none; }
.marker .q { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: var(--plum); color: var(--white); font-family: var(--body); font-weight: 600; font-size: 19px; box-shadow: 0 0 0 5px rgba(255, 255, 255, .7), 0 6px 14px rgba(36, 48, 107, .28); animation: bob 1.8s ease-in-out infinite; }
.marker .name { display: none; align-items: center; min-height: 34px; padding: 0 14px; border-radius: 999px; background: var(--white); color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; box-shadow: 0 4px 12px rgba(36, 48, 107, .18); }
.marker.found .q { display: none; }
.marker.found .name { display: flex; }
@keyframes bob { 50% { transform: translateY(-5px); } }

.hud { position: fixed; z-index: 3; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.hud > * { pointer-events: auto; }
.back { justify-self: start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--glass); text-decoration: none; font-weight: 600; font-size: 15px; }
.back:hover { background: var(--white); }
.title { margin: 0; font-weight: 500; font-size: 16px; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
.score { justify-self: end; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.lamps { display: flex; gap: 5px; }
.lamp { width: 11px; height: 11px; border-radius: 50%; background: var(--white); box-shadow: inset 0 0 0 2px var(--ink-dim); transition: background .3s, box-shadow .3s; }
.lamp.on { background: var(--heart); box-shadow: inset 0 0 0 2px var(--heart); }

.tagline { position: fixed; z-index: 2; top: calc(60px + env(safe-area-inset-top, 0px)); left: 0; right: 0; margin: 0; text-align: center; font-weight: 500; font-size: clamp(26px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -.035em; color: var(--ink); pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#word { display: inline-block; min-width: 4.9em; text-align: left; color: var(--plum); }
#word.swap { animation: swap .5s cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes swap { from { transform: translateY(.3em) rotate(-3deg); } }

.pilot { position: fixed; z-index: 3; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 8px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.pilot-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; pointer-events: auto; }
.tour { min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--plum); color: var(--white); font-weight: 600; font-size: 15px; cursor: pointer; }
.tour:hover { background: #573BB5; }
.bar { height: 6px; border-radius: 999px; background: #E6ECF7; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--plum); transform-origin: left; animation: fill 8s linear both; }
.card:hover .bar i, .card:focus-within .bar i { animation-play-state: paused; }
@keyframes fill { from { transform: scaleX(0); } }
.hint { margin: 0; font-size: 14px; font-weight: 500; color: var(--ink); text-align: center; background: var(--glass); padding: 5px 12px; border-radius: 999px; }
.keys { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 18px; pointer-events: auto; }
.group { display: flex; align-items: center; gap: 6px; }
.group span { font-weight: 600; font-size: 14px; }
.key { display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 13px; background: var(--white); color: var(--ink); box-shadow: 0 4px 0 #AEC6E2; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
.key.down { transform: translateY(3px); box-shadow: 0 1px 0 #AEC6E2; background: #EEE8FF; }

.card { position: fixed; z-index: 4; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); box-sizing: border-box; width: min(540px, calc(100vw - 24px)); max-height: 46%; overflow-y: auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 10px; border-radius: 26px; background: var(--white); color: var(--ink); box-shadow: 0 16px 40px rgba(36, 48, 107, .22); animation: pop .42s cubic-bezier(.2, 1.3, .4, 1) both; }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.tag { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--ink-dim); }
.card h2 { margin: 4px 0 0; font-weight: 500; font-size: 28px; line-height: 1.15; letter-spacing: -.025em; text-wrap: balance; }
.card p.txt { margin: 0; font-size: 16px; line-height: 1.55; font-weight: 400; color: var(--ink-dim); }
.close { flex: none; width: 44px; height: 44px; margin: -6px -6px 0 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: none; cursor: pointer; }
.close:hover { background: #EDF3FB; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.act { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; box-sizing: border-box; border: 0; border-radius: 13px; background: var(--plum); color: var(--white); font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; }
.act:hover { background: #573BB5; }
.act.alt { background: none; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.act.alt:hover { background: #EDF3FB; }
.email { font-weight: 600; font-size: 18px; overflow-wrap: anywhere; user-select: all; }
@keyframes pop { from { opacity: 0; transform: translateX(-50%) translateY(24px) scale(.95); } }

#fallback { position: fixed; z-index: 2; inset: 150px 16px auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; max-width: 560px; margin: 0 auto; }
#fallback button { min-height: 56px; border: 0; border-radius: 14px; background: var(--white); font-weight: 600; cursor: pointer; }

@media (max-width: 759px) {
  .hud { grid-template-columns: auto 1fr auto; }
  .title { justify-self: center; font-size: 15px; }
  .tagline { font-size: 25px; }
  #word { display: block; min-width: 0; text-align: center; }
  .back span { display: none; }
  .back { padding: 0 14px; }
  .lamps { display: none; }
  .group span { display: none; }
  .key { width: 56px; height: 52px; }
  .keys { gap: 8px 14px; }
  .card h2 { font-size: 25px; }
  .card p.txt { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { .marker .q, .card, #word.swap, .bar i { animation: none; } }
</style>


<div id="stage">
  <canvas id="world" role="img" aria-label="A small clay planet with blue oceans and green land, a purple plane flying around it, and six places to find."></canvas>
  <div id="markers"></div>
</div>

<header class="hud">
  <a class="back" href="https://amyherreradesign.framer.website/" target="_top" aria-label="Back to Amy's portfolio"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg><span>Portfolio</span></a>
  <h1 class="title">Amy's World</h1>
  <div class="score" role="status"><span class="lamps" id="lamps" aria-hidden="true"></span><span id="count">FOUND 0/6</span></div>
</header>

<p class="tagline" aria-label="Designing products that are impactful, delightful, inclusive and intentional">Designing products that are <span id="word" aria-hidden="true">Impactful</span></p>

<div class="pilot" id="pilot">
  <div class="pilot-top">
    <p class="hint" id="hint">Fly over a ? to discover it</p>
    <button class="tour" id="tour" type="button">Take the quick tour</button>
  </div>
  <div class="keys" role="group" aria-label="Flight controls">
    <div class="group"><button class="key" type="button" data-key="left" aria-label="Turn left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><button class="key" type="button" data-key="right" aria-label="Turn right"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button><span>Steer</span></div>
    <div class="group"><button class="key" type="button" data-key="up" aria-label="Go faster"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15l7-7 7 7"></path></svg></button><span>Faster</span></div>
    <div class="group"><button class="key" type="button" data-key="down" aria-label="Go slower"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"></path></svg></button><span>Slower</span></div>
  </div>
</div>

<section class="card" id="card" hidden aria-live="polite"></section>
<div id="fallback" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function () {
  'use strict';
  var PORTFOLIO = 'https://amyherreradesign.framer.website/';
  var PLACES = [
    { id: 'home', name: 'Home', title: "Hi, I'm Amy!", text: "I'm a product designer and student at the University of Michigan, passionate about integrating design with code and creating inclusive, innovative user experiences.", links: [{ label: 'About me', href: PORTFOLIO + '#intro' }] },
    { id: 'workshop', name: 'What I make', title: 'What I make', text: "I've always enjoyed making things: DIY projects, apparel design, graphics, photography and teaching arts & crafts to youth.", links: [{ label: 'See my work', href: PORTFOLIO + '#work' }] },
    { id: 'tower', name: 'Where I study', title: 'Where I study', text: "Michigan has been home base since 2022. I studied Information Science and Anthropology, and I'm finishing my M.S. in HCI in May 2027.", links: [{ label: 'My education', href: PORTFOLIO + '#education' }] },
    { id: 'camera', name: 'My photos', title: 'What I photograph', text: 'In my free time I collect pics with my camera, a Sony ZVE-10.', links: [{ label: 'See my photos', href: 'https://www.instagram.com/amherrfotos' }] },
    { id: 'record', name: 'My music', title: 'What I\'m listening to', text: 'Breathe Deeper by Tame Impala, from The Slow Rush.', links: [{ label: 'Listen on Spotify', href: 'https://open.spotify.com/track/3LbZIhU0smEU5SUnxod4j4' }] },
    { id: 'mail', name: 'Say hi', title: 'Say hi!', text: 'I would love to hear from you.', email: 'amyrod@umich.edu', links: [{ label: 'LinkedIn', href: 'https://www.linkedin.com/in/amy-herreraa/' }] }
  ];
  var found = PLACES.map(function () { return false; });
  var current = -1, api = null, finaleShown = false, touring = false;
  var $ = function (id) { return document.getElementById(id); };
  var card = $('card'), hint = $('hint'), lamps = $('lamps');

  PLACES.forEach(function () { var s = document.createElement('span'); s.className = 'lamp'; lamps.appendChild(s); });

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function linkHtml(l, alt) { return '<a class="act' + (alt ? ' alt' : '') + '" href="' + l.href + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>'; }
  var closeBtn = '<button class="close" id="close" type="button" aria-label="Close and keep exploring"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>';

  function renderCard(html) {
    card.innerHTML = html; card.hidden = false; $('pilot').hidden = true;
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
    $('close').onclick = function () { leave(); };
    var copy = $('copy');
    if (copy) copy.onclick = function () {
      var done = function () { copy.textContent = 'Copied!'; };
      var sel = function () { var r = document.createRange(); r.selectNodeContents($('email')); var w = getSelection(); w.removeAllRanges(); w.addRange(r); copy.textContent = 'Email selected'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText('amyrod@umich.edu').then(done, sel); else sel();
    };
  }
  function showPlace(i) {
    var p = PLACES[i]; current = i;
    if (!found[i]) { found[i] = true; update(i); }
    var n = found.filter(Boolean).length;
    var body = '<p class="txt">' + esc(p.text) + '</p>';
    if (p.email) body += '<span class="email" id="email">' + p.email + '</span>';
    var acts = (p.email ? '<button class="act" id="copy" type="button">Copy my email</button>' : '') + p.links.map(function (l) { return linkHtml(l, !!p.email); }).join('');

    renderCard('<div class="card-top"><div><p class="tag">' + tag + '</p><h2>' + esc(p.title) + '</h2></div>' + closeBtn + '</div>' + body + '<div class="actions">' + acts + '</div>' + bar);
    if (touring) {
      $('next').onclick = nextStop;
      $('fill').addEventListener('animationend', nextStop);
    }
  }
  function nextStop() {
    if (!touring) return;
    if (current >= 5) { leave(); return; }
    visit(current + 1);
  }
  function startTour() { touring = true; visit(0); }
  function update(i) {
    var n = found.filter(Boolean).length;
    $('count').textContent = n === 6 ? 'ALL 6 FOUND' : 'FOUND ' + n + '/6';

    var m = document.querySelectorAll('.marker')[i];
    if (m) { m.classList.add('found'); m.setAttribute('aria-label', 'Go to ' + PLACES[i].name); }
    if (api) api.light(i);
  }
  function finale() {
    finaleShown = true; current = -1;
    if (api) { api.home(); api.fireworks(); }
    renderCard('<div class="card-top"><div><p class="tag">ALL 6 FOUND</p><h2>You saw my whole world!</h2></div>' + closeBtn + '</div><p class="txt">Thanks for flying by.</p><div class="actions">' + linkHtml({ label: 'Back to my portfolio', href: PORTFOLIO }) + '</div>');
  }
  function leave() {
    touring = false;
    var all = found.every(Boolean);
    card.hidden = true; card.innerHTML = ''; $('pilot').hidden = false;

    current = -1; if (api) api.home();
  }
  function visit(i) { if (api) api.goTo(i); showPlace(i); }

  // Flight controls: arrow keys, WASD, or the on-screen buttons
  var input = { left: false, right: false, up: false, down: false };
  var KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down' };

    input[k] = on;
    var el = document.querySelector('.key[data-key="' + k + '"]'); if (el) el.classList.toggle('down', on);

  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !card.hidden) { leave(); return; }

    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (t) { b.addEventListener(t, function () { setKey(k, false); }); });
  });

  $('tour').onclick = startTour;

  // Designing products that are ...
  var WORDS = ['Impactful', 'Delightful', 'Inclusive', 'Intentional'], wi = 0, word = $('word');
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(function () { wi = (wi + 1) % WORDS.length; word.textContent = WORDS[wi]; word.classList.remove('swap'); void word.offsetWidth; word.classList.add('swap'); }, 2400);

  function fallback() {
    var f = $('fallback'); f.hidden = false; $('pilot').hidden = true;
    PLACES.forEach(function (p, i) { var b = document.createElement('button'); b.type = 'button'; b.textContent = p.name; b.onclick = function () { showPlace(i); }; f.appendChild(b); });
  }

  // Markers
  var markerEls = PLACES.map(function (p, i) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'marker';
    b.setAttribute('aria-label', 'Discover a hidden place');
    b.innerHTML = '<span class="q" aria-hidden="true">?</span><span class="name">' + esc(p.name) + '</span>';
    b.onclick = function () { visit(i); };
    $('markers').appendChild(b); return b;
  });

  if (typeof THREE === 'undefined') { fallback(); return; }

  /* ---------- World ---------- */
  var T = THREE, TAU = Math.PI * 2, R = 2, LAT = .35, VIEW_E = .9;
  var PLANE_E = .46, ALT = .46, TRIGGER = .3;               // where the plane hovers, and how close counts as found
  var CRUISE = .3, FAST = .75, SLOW = .1, TURN = 2;
  var COL = { walls: '#FFF6E6', roof: '#E8705F', teal: '#58B8B0', sun: '#F7C65B', dark: '#39406E', wood: '#B98A5C', glass: '#BDE0F5', plum: '#7557D8', heart: '#C9475A', trunk: '#9A7E5C', leaf: ['#6FAE5A', '#7FBF68', '#5F9E52', '#8CC873'], flower: ['#FFFFFF', '#F7C65B', '#F49BB0'] };
  var SITES = [0, 1, 2, 3, 4, 5].map(function (i) { return i / 6 * TAU; });
  var V = function (x, y, z) { return new T.Vector3(x, y, z); };
  var dirOf = function (lat, lon) { return V(Math.sin(lon) * Math.cos(lat), Math.sin(lat), Math.cos(lon) * Math.cos(lat)); };
  var siteDirs = SITES.map(function (l) { return dirOf(LAT, l); }), POLE = V(0, 1, 0);
  var smooth = function (a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  var clamp01 = function (x) { return Math.min(1, Math.max(0, x)); };
  var backOut = function (t) { var c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  function rng(seed) { return function () { seed = (seed + 0x6D2B79F5) | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function siteDist(d) { var m = 9; for (var i = 0; i < 6; i++) m = Math.min(m, d.angleTo(siteDirs[i])); return m; }

  function mat(color, extra) { return new T.MeshStandardMaterial(Object.assign({ color: color, roughness: .62, metalness: 0 }, extra || {})); }
  function add(parent, geo, color, pos, o) {
    o = o || {};

      var turn = (input.right ? 1 : 0) - (input.left ? 1 : 0);
      var target = paused ? 0 : (input.up ? FAST : input.down ? SLOW : (st.flying ? CRUISE : CRUISE * .5));
      st.speed += (target - st.speed) * (1 - Math.exp(-dt * 3));
      if (!paused) st.heading += turn * TURN * dt;
      st.bank += (turn * .6 - st.bank) * (1 - Math.exp(-dt * 6));
      f.copy(E1).multiplyScalar(Math.cos(st.heading)).addScaledVector(E2, -Math.sin(st.heading)).normalize();
      if (reduced && !st.flying) st.speed = 0;
      if (st.speed > .001) { axis.crossVectors(N, f).normalize(); step.setFromAxisAngle(axis, -st.speed * dt); Q.premultiply(step); }
      if (st.tween) Q.slerp(Qt, 1 - Math.exp(-dt * 3.2));
      world.quaternion.copy(Q);

      plane.position.copy(N).multiplyScalar(R + ALT + Math.sin(st.t * 1.6) * .018);
      right.crossVectors(N, f).normalize();
      mtx.makeBasis(right, N, f); qp.setFromRotationMatrix(mtx); qr.setFromAxisAngle(Zax, st.bank);
      plane.quaternion.copy(qp).multiply(qr);
      plane.userData.prop.rotation.z = st.t * 24;

      // Contrail, left in the world so it stays behind the plane
      puffClock += dt;
      if (!paused && puffClock > .14 && st.speed > .08) {
        puffClock = 0; var pf = puffs[pi = (pi + 1) % puffs.length];
        tmp.copy(plane.position).addScaledVector(f, -.26); world.worldToLocal(tmp); pf.position.copy(tmp); pf.userData.life = 1; pf.visible = true;
      }
      puffs.forEach(function (x) { if (x.userData.life > 0) { x.userData.life -= dt * .7; x.scale.setScalar(Math.max(.01, x.userData.life * 1.1)); if (x.userData.life <= 0) x.visible = false; } });

      // Flying over an undiscovered place opens it
      if (st.flying && st.stop < 0 && current < 0 && !st.drag) {
        for (var i = 0; i < 6; i++) if (!found[i]) { tmp.copy(siteDirs[i]).applyQuaternion(Q); if (tmp.angleTo(N) < TRIGGER) { visit(i); break; } }
      }

      var kk = 1 - Math.exp(-dt * 3.2); st.sx += (st.tsx - st.sx) * kk; st.sy += (st.tsy - st.sy) * kk; st.z += (st.tz - st.z) * kk;
      camera.position.z = st.z; camera.setViewOffset(st.w, st.h, -st.sx * st.w, -st.sy * st.h, st.w, st.h);

      sites.forEach(function (s) {
        if (s.tick) s.tick(st.t);
        if (s.on && s.pop < 1) s.pop = Math.min(1, s.pop + dt * 1.8);
        if (s.on) { s.badge.scale.setScalar(Math.max(.001, .42 * backOut(s.pop))); s.badge.rotation.y = st.t * 1.2; }
      });
      if (st.party > 0) { st.party -= dt; bigHeart.scale.setScalar(1.15 + .28 * Math.abs(Math.sin(st.t * 5)) * clamp01(st.party)); }

      if (fwT >= 0) {
        fwT += dt; var a2 = fwGeo.attributes.position.array;
        for (var n = 0; n < FW; n++) { var vv = fwVel[n]; a2[n * 3] += vv[0] * dt; a2[n * 3 + 1] += (vv[1] - fwT * 2.4) * dt; a2[n * 3 + 2] += vv[2] * dt; }
        fwGeo.attributes.position.needsUpdate = true; fwMat.opacity = clamp01(2.2 - fwT * .8);
        if (fwT > 2.8) { fwT = -1; fwMat.opacity = 0; }
      }
      renderer.render(scene, camera);

      camDir.copy(camera.position).normalize();
      markerEls.forEach(function (el, i) {
        sites[i].anchor.getWorldPosition(wp); np.copy(wp).normalize();
        var face = np.dot(camDir);
        wp.project(camera);
        var my = (1 - wp.y) / 2 * st.h, vis = st.done && face > .12 && st.stop !== i && my > 150;
        el.style.transform = 'translate(' + ((wp.x + 1) / 2 * st.w).toFixed(1) + 'px,' + ((1 - wp.y) / 2 * st.h).toFixed(1) + 'px) translate(-50%,-100%)';
        el.style.opacity = vis ? String(clamp01((face - .12) * 6)) : '0';
        el.style.pointerEvents = vis ? 'auto' : 'none'; el.tabIndex = vis ? 0 : -1;
      });
    }
    frame();
    return { goTo: goTo, home: home, fireworks: fireworks, light: function (i) { sites[i].on = true; }, takeOff: function () { st.flying = true; } };
  }

  api = mount($('world'));
  if (!api) fallback();
})();
</script>
